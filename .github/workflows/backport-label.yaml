name: Backport label

on:
  # Documentation for pull_request event: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
  pull_request:
    types: [labeled]
    # So I remember to only run this on PRs targetting release branches
    branches:
    - test-main
    - 'test-release/**'

jobs:
  backport-label:
    permissions:
      # Necessary to add label
      pull-requests: write

    # For now, only run if the PR is merged
    if: github.event.pull_request.merged == true && startsWith(github.event.label.name, 'cherry-pick/')
    uses: tomleb/gha-tests/.github/workflows/cherry-pick-from-labels.yaml@main
    with:
      label-added: ${{ github.event.label.name }}
      all-labels-json: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      pr-number: ${{ github.event.pull_request.number }}
      git-user-email: "tom.lebreux@suse.com"
      git-user-name: "Tom Lebreux <tom.lebreux@suse.com>"
    secrets:
      token: ${{ secrets.GH_TOKEN }}
