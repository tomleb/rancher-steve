name: Backport label

on:
  # Documentation for pull_request event: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
  pull_request:
    types: [labeled, closed]
    # So I remember to only run this on PRs targetting release branches
    # branches:
    # - main
    # - 'release/**'

jobs:
  backport-label:
    # For now, only run if the PR is merged
    # if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      #   with:
      #     token: ${{ secrets.GH_TOKEN }}
      #     persist-credentials: true
      #     fetch-depth: 0

      - run: |
          echo "PR_LABELS_JSON=${{ toJSON(github.event.pull_request.labels) }}" >> $GITHUB_ENV
          gh pr -R ${{ github.repository }} view ${{ github.event.pull_request.number }} --json labels | jq -r '.labels[].name'
        env:
          GH_TOKEN: ${{ github.token }}

      - run: |
          echo "${{ env.PR_LABELS_JSON }}"
          echo "${{ env.PR_LABELS_JSON }}" | jq '.[].name'


