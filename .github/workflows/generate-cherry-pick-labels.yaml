name: Auto-generate cherry-pick labels

on:
  workflow_dispatch:
  create:

jobs:
  generate-cherry-pick-labels:
    permissions:
      # Necessary to create/edit labels
      issues: write
    uses: tomleb/rancher-cherry-pick-action/.github/workflows/generate-cherry-pick-labels.yaml@label-action
    with:
      branch-filter-regex: "^test-main|test-release/.*"
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
